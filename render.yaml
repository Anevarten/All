services:
  - type: web
    name: natures-slumber
    runtime: python
    branch: "Nature's-Slumber"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: db
      mountPath: /data
      sizeGB: 1
